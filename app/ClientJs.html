<script>
'use strict';

function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

var NET_PENDING = 0, NET_SHOW_T = null, NET_HIDE_T = null, NET_SHOWN_AT = 0;
var PENDING_MUTATION = null, MUTATION_IN_FLIGHT = false;
var RECOVERABLE_ACTIONS = ['intake.save','intake.transition','access.save','access.scope.save','site.save','metric.save','metric.retire','goal.save','goal.retire','actual.saveMonth','actual.correct'];
function pendingValuesHtml_(value) {
  if (Array.isArray(value)) { return '<ol>' + value.map(function(item) { return '<li>' + pendingValuesHtml_(item) + '</li>'; }).join('') + '</ol>'; }
  if (value && typeof value === 'object') {
    return '<dl class="detail-list">' + Object.keys(value).filter(function(key) { return !/^(id|submissionKey|operationKey|version|updatedAt|originalSite)$/.test(key); }).map(function(key) {
      var content = value[key], label = key.replace(/([a-z])([A-Z])/g,'$1 $2');
      if (/Id$/.test(key)) {
        if (!content) { return ''; }
        var records = key === 'scopeId' ? ADMIN.units : typeof PERF !== 'undefined' && key === 'goalId' && PERF.entry ? PERF.entry.bands : [];
        var record = (records || []).filter(function(item) { return item.unitId === content || item.goalId === content; })[0];

function showPendingMutation_() {

  if (!panel) { panel = document.createElement('section'); panel.id = 'pendingMutation'; panel.className = 'card pad-lg recovery-panel'; panel.setAttribute('role','alert'); document.body.appendChild(panel); }
  panel.innerHTML = '<h2>A save needs recovery</h2><p>Keep this page open. Retry submits the original change shown below. Later edits are not included. New saves are paused until this is resolved.</p><details><summary>Review the original change</summary><div id="pendingMutationValues" tabindex="0" aria-label="Original submitted values"></div></details><button class="btn btn-primary" id="retryOriginalButton" type="button" onclick="retryPendingMutation_()">Retry original change</button><p id="pendingMutationResult"></p>';
  var visible = {};
  Object.keys(PENDING_MUTATION.payload).forEach(function(key) { if (!/^(submissionKey|operationKey|version)$/.test(key)) { visible[key] = PENDING_MUTATION.payload[key]; } });

}
function retryPendingMutation_() {
  var original = PENDING_MUTATION;

    if (result.ok) {
      closeDialog(); toast('Original change saved. Later form edits were not submitted.');

      showPendingMutation_(); var message = document.getElementById('pendingMutationResult'); if (message) { message.textContent = friendly(result) + ' If retry remains blocked, ask the deployment administrator to review the operation.'; }

function netStart_() {

    NET_SHOW_T = null;

}
function netEnd_() {
  NET_PENDING = Math.max(0, NET_PENDING - 1);

  if (NET_SHOW_T) { clearTimeout(NET_SHOW_T); NET_SHOW_T = null; }
  var el = document.getElementById('netbar');
  if (!el || !el.classList.contains('on')) { return; }
  var wait = Math.max(0, 300 - (Date.now() - NET_SHOWN_AT));

    NET_HIDE_T = null;
    if (NET_PENDING === 0) { var e = document.getElementById('netbar'); if (e) { e.classList.remove('on'); } }

// A server that is busy under concurrent load returns a retryable E_BUSY; the
// operation did not run, so retrying is safe. Back off with jitter so a burst
// of clients spreads its retries instead of stampeding together. Creates are
// idempotent by submissionKey, so a retried create can never double-insert.
function run(action, payload, recovering) {
  var mutation = RECOVERABLE_ACTIONS.indexOf(action) !== -1;
  if (mutation && MUTATION_IN_FLIGHT) { return Promise.resolve({ok:false,code:'E_BUSY',error:'E_BUSY: another save is still running.'}); }
  if (mutation && PENDING_MUTATION && !recovering) { showPendingMutation_(); return Promise.resolve({ok:false,code:'E_RECOVERY',error:'E_RECOVERY: use Retry original change before submitting another save.'}); }
  if (mutation) { payload = JSON.parse(JSON.stringify(payload || {})); MUTATION_IN_FLIGHT = true; }

    return runOnce_(action, payload).then(function (result) {

      }

    });

}
function friendly(result) {
  var msg = result && result.error ? String(result.error) : 'Something went wrong. Try again.';
  if (msg.indexOf('E_CONFLICT') === 0) { return msg.replace('E_CONFLICT: ', ''); }
  if (msg.indexOf('E_FORBIDDEN') === 0) { return msg.replace('E_FORBIDDEN: ', ''); }
  if (msg.indexOf('E_VALIDATION') === 0) { return msg.replace('E_VALIDATION: ', ''); }
  if (msg.indexOf('E_RECOVERY') === 0) { return msg.replace('E_RECOVERY: ', ''); }
  if (msg.indexOf('E_RATE_LIMIT') === 0) { return 'Too many actions were sent. Wait 1 minute and try again.'; }
  if (msg.indexOf('E_BUSY') === 0) { return 'The hub is busy saving other changes. Wait a moment and try again.'; }

}
function deliveryStatusHtml_(counts) {

  var uncertain = Number(counts.UNKNOWN || 0), failed = Number(counts.FAILED || 0);

    + '<div class="row"><span>Accepted by Google for sending</span><span>' + Number(counts.SENT || 0) + '</span></div>'
    + '<div class="row"><span>Delivery unconfirmed</span><span>' + uncertain + '</span></div>'
    + '<div class="row"><span>Stopped after retries</span><span>' + failed + '</span></div></div>'
    + (uncertain ? '<p role="status">Some messages may already have been sent. They will not be resent automatically. An administrator must review delivery before sending another message.</p>' : '')

/**
 * Paint a whole screen.
 *
 * A new screen starts at its own top. Without this, opening a goal from a
 * scrolled dashboard drops the reader halfway down it, and on a phone that
 * hides the guidance panel they opened the goal to read. The app scrolls inside
 * .main on wide screens and inside the window on narrow ones, so both are reset
 * and both are wrapped, because the Apps Script sandbox owns the outer frame.
 */
function setMain(html) {
  var main = document.getElementById('main');

  main.focus();

}
function loadingHtml(text) { return '<div class="loading"><span class="spin"></span> ' + esc(text || 'Loading...') + '</div>'; }
function emptyHtml(title, body, action) { return '<div class="empty"><h3>' + esc(title) + '</h3><p>' + esc(body) + '</p>' + (action || '') + '</div>'; }
function errorHtml(message) { return '<div class="card pad-lg"><h3>We could not load this view</h3><p>' + esc(message) + '</p><button class="btn btn-ghost" type="button" onclick="go(CURRENT)">Try again</button></div>'; }

var DIALOG_SEQ = 0;

}

function dialogCommandKey_() { var wrap = document.getElementById('dialogWrap'); return wrap ? wrap.dataset.operationKey : makeSubmissionKey_(); } function dialogSeq_() { var wrap = document.getElementById('dialogWrap'); return wrap ? wrap.dataset.seq : ''; }

}

function start() {

function renderNav() {

function canNav(id) { return (BOOT.nav || []).some(function (item) { return item.id === id; }); }

function renderHome() {

    var action = '<div class="card pad-lg home-action"><div><h2>Intake workspace</h2><p>Every save is attributed and version checked. If another person changes a request first, the app asks you to reload instead of overwriting their work.</p></div><div class="actions"><button class="btn btn-ghost" type="button" onclick="go(\'intake\')">View Intake</button>' + (BOOT.canCreateIntake ? '<button class="btn btn-primary" type="button" onclick="openIntakeForm()">Create request</button>' : '') + '</div></div>';

function renderIntake() {

function openIntakeForm(item) {
