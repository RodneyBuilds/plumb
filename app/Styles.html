/* Shared theme variables. */
:root{
  --green:#19713f; --green-mark:#19713f; --green-bright:#58d68c;
  --amber:#9a6508; --charcoal:#272727; --ink:#171717;
  --beige:#f2f2f0; --grey:#efefed; --cyan:#176b87; --pink:#a62c4a;
  --ok-bg:#e3f0e7; --ok-tx:#145a34; --err-bg:#f6e0e3; --err-tx:#7c2837;
  --warn-bg:#f8ead0; --warn-tx:#755011; --focus:#19713f;
  --sans:"Source Sans 3","Segoe UI",sans-serif;
  --display:"Manrope","Segoe UI",sans-serif;
  /* Guidance edges. These resolve against whichever theme is active, so they are
     declared once rather than twice.  */
  --guide-edge:color-mix(in srgb,var(--primary) 28%,transparent);
  --verify-edge:color-mix(in srgb,var(--ok-tx) 25%,transparent);
  --health-ok-edge:color-mix(in srgb,var(--ok-tx) 25%,transparent);
  --health-bad-edge:color-mix(in srgb,var(--err-tx) 28%,transparent);
}
:root[data-theme="light"]{

  --border-strong:#c4c4c0; --nav-bg:#efefed; --bar:#fff; --shadow:0 14px 42px rgba(0,0,0,.06);
  --primary:#19713f; --primary-hover:#125b32; --primary-soft:#e3f0e7; --link:#145a34;
  --situation-sustain:#145A34; --situation-recover:#755011; --situation-urgent:#7C2837;
  --scope-local:#176B87; --info-bg:#E4EFF2; --info-tx:#125767;
  --doc-tile:#FFFFFF; --doc-mark:#176B87;
}
:root[data-theme="dark"]{
  --bg:#111211; --surface:#1b1c1b; --surface-2:#242524; --surface-3:#242524;
  --text:#eee; --heading:#fafafa; --muted:#b6b6b6; --border:#373837;
  --border-strong:#505150; --nav-bg:#0a0b0a; --bar:#0e0f0e; --shadow:none;
  --primary:#58d68c; --primary-hover:#6fe2a0; --primary-soft:#24372b; --link:#78e6aa;
  --ok-bg:#24372b; --ok-tx:#78e6aa; --err-bg:#3c252a; --err-tx:#f0a0aa;
  --warn-bg:#3a3020; --warn-tx:#edca88;

     which is below the floor for text that somebody has to read. */

  --scope-local:#7FD0E0; --info-bg:#123038; --info-tx:#7FD0E0;

}

.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:end;flex-wrap:wrap;margin-bottom:16px}.record-grid{display:grid;gap:12px}.record-card{display:grid;grid-template-columns:1fr auto;gap:12px}.record-card.archived{opacity:.65}.record-meta{font-size:12px;color:var(--muted);margin-top:5px}.dialog-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:18px}.dialog{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:680px;width:100%;max-height:90vh;overflow:auto}.dialog h2{margin-bottom:18px}.markdown p{margin:0 0 10px}.markdown ul{padding-left:22px}.markdown h2,.markdown h3{margin:18px 0 8px}.search{min-width:260px}.danger{color:var(--err-tx);border-color:var(--err-tx)}

/* =====================================================================
   performance layer.
   Everything below is scoped under .perf so no Intake screen shifts by a
   pixel. Tokens, colours and shapes use the shared theme; the
   only additions are motion tokens and the trajectory.
   ===================================================================== */
:root{
  /* Interaction transitions stay inside the 140 to 180ms band the design
     contract fixes. Entrance choreography is a separate, slower token: a
     count-up or a line drawing itself is a first-paint event, not a response
     to a click, and 160ms is too short to read as either. */
  --motion-interaction:160ms;
  --motion-stagger:44ms;
  --ease-out:cubic-bezier(.22,.61,.36,1);
}
.perf{--pct-num:var(--link)}
.perf .card{border-radius:18px;padding:20px 22px;box-shadow:var(--shadow)}
.perf .field{max-width:520px}
.perf .tnum{font-variant-numeric:tabular-nums}
.perf .muted-sm{color:var(--muted);font-size:12px}

/* Optical typography. Manrope is a variable face, so where the axis is live the
   display sizes get a slightly lighter weight and tighter tracking than the
   static instances would give. Where it is not, the named weights still apply. */
.perf h1,.perf .now,.perf .bm strong{font-family:var(--display);font-variant-numeric:tabular-nums}
@supports (font-variation-settings:"wght" 550){
  .perf .page-head h1{font-variation-settings:"wght" 520;letter-spacing:-.036em}
  .perf .now{font-variation-settings:"wght" 640}
  .perf .bm strong{font-variation-settings:"wght" 500}
  .perf .gn{font-variation-settings:"wght" 660}
}

/* ---------- status pills. Colour is never the only signal. ---------- */
.perf .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.perf .pill .gl{font-weight:800;font-size:11px;line-height:1}
.perf .p-ok{background:var(--ok-bg);color:var(--ok-tx)}
.perf .p-warn{background:var(--warn-bg);color:var(--warn-tx)}
.perf .p-err{background:var(--err-bg);color:var(--err-tx)}
.perf .p-none{background:var(--surface-3);color:var(--muted)}

/* ---------- attention brief ---------- */
.perf .brief{display:grid;grid-template-columns:minmax(300px,1.5fr) repeat(3,minmax(120px,.75fr));border:1px solid var(--border);border-radius:20px;background:var(--surface);overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)}
.perf .brief>div{padding:19px 20px;border-right:1px solid var(--border);min-height:108px}
.perf .brief>div:last-child{border-right:0}
.perf .brief .lead{position:relative;display:flex;flex-direction:column;justify-content:center}
.perf .brief .lead::before{content:"";position:absolute;left:0;top:19px;bottom:19px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.perf .bl{color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.perf .brief .lead strong{display:block;margin:5px 0;color:var(--heading);font-family:var(--display);font-size:17px;font-weight:500;line-height:1.28}
.perf .brief .lead .sm{color:var(--muted);font-size:11px}
.perf .bm{display:flex;flex-direction:column;justify-content:center}
.perf .bm strong{display:block;margin-top:7px;color:var(--heading);font-size:29px;font-weight:500;line-height:1}
.perf .bm span{display:block;margin-top:6px;color:var(--muted);font-size:10.5px}

/* ---------- goal cards ---------- */
.perf .gridcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:14px}
.perf .gc{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:17px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.perf .gc.waiting,.perf .gc.stale{background:var(--surface-2)}
.perf .gc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.perf .gn{font-weight:700;font-size:13.5px;color:var(--heading);line-height:1.3;text-align:left;width:100%;font-family:var(--display)}
.perf button.gn:hover{color:var(--link);text-decoration:underline}
.perf .gk{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
.perf .gsite{color:var(--muted);font-size:10.5px;margin-top:2px}
.perf .gfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto}
.perf .now{font-weight:700;font-size:23px;color:var(--heading);line-height:1}
.perf .now small{display:block;font-family:var(--sans);font-weight:400;font-size:10.5px;color:var(--muted);margin-top:4px}
.perf .now.quiet{font-size:15px;color:var(--muted);font-weight:500}
.perf .trend{color:var(--muted);font-size:10.5px;font-weight:600;margin-top:8px}
.perf .trend.warn{color:var(--warn-tx)}
.perf .enterbtn{width:100%;margin-top:11px;background:transparent;border:1.5px solid var(--primary);color:var(--primary);border-radius:10px;padding:9px;font-weight:700;font-size:12px;transition:background-color var(--motion-interaction) var(--ease-out)}
.perf .enterbtn:hover{background:var(--primary-soft)}

/* A card that has room to breathe puts the number and the pill on one line and
   gives the trajectory more height. Sized from the card, not the page, so a
   card in a narrow column behaves like a narrow card wherever it sits. */
@supports (container-type:inline-size){
  .perf .gc{container-type:inline-size}
  @container (min-width:340px){
    .perf .chart{height:74px}
    .perf .now{font-size:26px}
  }
}

/* ---------- the signature element: the trajectory ---------- */
.perf .chart{position:relative;height:58px;margin:16px 0 11px}
.perf .chart-ink{position:absolute;inset:0}
.perf .chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.perf .chart .pt{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--primary);border:2px solid var(--surface);transform:translate(-50%,50%);z-index:2}
.perf .gc.waiting .chart .pt,.perf .gc.stale .chart .pt{border-color:var(--surface-2)}
.perf .chart .pt.last{width:11px;height:11px;box-shadow:0 0 0 3px var(--primary-soft)}
.perf .chart .gap{position:absolute;top:-2px;bottom:-2px;border-radius:3px;background:repeating-linear-gradient(45deg,transparent,transparent 3px,var(--border) 3px,var(--border) 5px);border:1px dashed var(--border-strong);z-index:1}
.perf .chart .nodata-mark{position:absolute;bottom:50%;width:11px;height:2px;border-radius:2px;background:var(--border-strong);transform:translate(-50%,50%);z-index:2}
.perf .chart .tline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--pink);z-index:0}
.perf .chart .tlab{position:absolute;right:0;font-size:9px;font-weight:700;color:var(--pink);background:var(--surface);padding:0 3px;transform:translateY(-50%);z-index:3;font-variant-numeric:tabular-nums}
.perf .gc.waiting .chart .tlab,.perf .gc.stale .chart .tlab{background:var(--surface-2)}
.perf .chart .axis{position:absolute;left:0;right:0;bottom:-14px;display:flex;justify-content:space-between;color:var(--muted);font-size:8.5px;letter-spacing:.04em}
.perf .chart.with-axis{margin-bottom:26px}

/* A view transition is used only for an in-place change, where there is no
   loading state to fight. Pinned to the interaction band, because that is what
   it is: a response to a click. */
::view-transition-old(root),::view-transition-new(root){animation-duration:var(--motion-interaction)}

/* ---------- entrance choreography ---------- */
@keyframes perfCardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes perfFadeIn{from{opacity:0}to{opacity:1}}
@keyframes perfDotIn{from{opacity:0;transform:translate(-50%,50%) scale(.4)}to{opacity:1;transform:translate(-50%,50%) scale(1)}}
